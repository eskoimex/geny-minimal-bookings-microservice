version: '3.8'
services:
  app:
    build: .
    env_file: .env.example
    ports: ["3000:3000"]
    depends_on: [postgres, redis]
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bookings
    ports: ["5432:5432"]
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes: { pgdata: {} }
