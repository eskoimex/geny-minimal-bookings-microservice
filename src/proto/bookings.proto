syntax = "proto3";

package bookings;

service BookingsService {
  rpc CreateBooking (CreateBookingRequest) returns (BookingResponse);
}

message CreateBookingRequest {
  string title = 1;
  string providerId = 2;
  string startAt = 3; // ISO string
  string endAt = 3; // ISO string
}

message BookingResponse {
  string id = 1;
  string title = 2;
  string providerId = 3;
  string startAt = 4;
  string endAt = 5;
}
